services:
  mysql:
    image: mysql:8
    container_name: hotel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: hotel
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - hotel-mysql-data:/var/lib/mysql

volumes:
  hotel-mysql-data:
